<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2F8C9A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lacobriga Survival</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div id="top">
    <div id="stocks"></div>
    <div id="clock"><span id="season"></span><button id="speed" aria-label="speed"></button></div>
  </div>
  <div id="warn"></div>
</div>

<div id="elder" hidden><div class="who">Ataecina</div><div id="elderText"></div><button id="elderSkip"></button></div>
<div id="toast"></div>
<div id="placeHint" hidden></div>

<div id="sheet" hidden><div id="sheetBody"></div></div>

<nav id="bottom">
  <button id="btnBuild"><span>🔨</span><b data-t="build"></b></button>
  <button id="btnTown"><span>🏘️</span><b data-t="town"></b></button>
  <button id="btnMenu"><span>☰</span><b data-t="menu"></b></button>
</nav>
<nav id="placeBar" hidden>
  <button id="btnCancel" class="no">✕</button>
  <div id="placeName"></div>
  <button id="btnOk" class="yes">✓</button>
</nav>

<div id="title" class="overlay">
  <div class="card">
    <h1>Lacobriga</h1>
    <h2 data-t="subtitle"></h2>
    <button id="btnContinue" class="big" data-t="continue"></button>
    <button id="btnNew" class="big" data-t="newTown"></button>
    <div id="diffRow"></div>
    <div class="row"><button id="btnLang" class="small"></button></div>
    <p class="fine" data-t="prototypeNote"></p>
  </div>
</div>

<div id="over" class="overlay" hidden><div class="card" id="overBody"></div></div>

<script src="i18n.js"></script>
<script src="game.js"></script>
</body>
</html>
